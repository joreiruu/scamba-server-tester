 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Model Spam Classifier</title>
    <!-- ...existing style code... -->
    <style>
        /* ...existing styles... */
        .model-info {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .probability-bars {
            margin-top: 1rem;
            text-align: left;
        }
        .prob-bar {
            margin: 8px 0;
        }
        .prob-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .prob-fill {
            height: 8px;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .not-spam-bar { background-color: #4CAF50; }
        .spam-bar { background-color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Multi-Model Spam Classifier</h2>
            <p class="model-info">Compare results from different models</p>
        </div>
        
        <div class="input-group">
            <label for="model">Select Model:</label>
            <select id="model">
                <option value="xlmr">XLM-R (Multi-lingual)</option>
                <option value="mbert">mBERT (Multi-lingual)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="message">Enter Message:</label>
            <textarea id="message" placeholder="Type or paste your message here"></textarea>
        </div>

        <button onclick="classify()" id="submitBtn">Analyze Message</button>

        <div class="result-container" id="resultContainer">
            <div class="result-text" id="resultText"></div>
            <div class="confidence-text" id="confidenceText"></div>
            <div class="probability-bars">
                <div class="prob-bar">
                    <div class="prob-label">
                        <span>Not Spam</span>
                        <span id="notSpamProb">0%</span>
                    </div>
                    <div class="prob-fill not-spam-bar" id="notSpamBar" style="width: 0%"></div>
                </div>
                <div class="prob-bar">
                    <div class="prob-label">
                        <span>Spam</span>
                        <span id="spamProb">0%</span>
                    </div>
                    <div class="prob-fill spam-bar" id="spamBar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check available models on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('http://localhost:5000/available_models');
                const data = await response.json();
                
                const modelSelect = document.getElementById('model');
                modelSelect.innerHTML = ''; // Clear existing options
                
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.text = model === 'xlmr' ? 'XLM-R (Multi-lingual)' : 
                                 model === 'mbert' ? 'mBERT (Multi-lingual)' : model;
                    modelSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading models:', error);
            }
        });

        async function classify() {
            const message = document.getElementById('message').value.trim();
            const model = document.getElementById('model').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const confidenceText = document.getElementById('confidenceText');
            
            // Get probability elements
            const notSpamProb = document.getElementById('notSpamProb');
            const spamProb = document.getElementById('spamProb');
            const notSpamBar = document.getElementById('notSpamBar');
            const spamBar = document.getElementById('spamBar');

            if (!message) {
                alert('Please enter a message.');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading"></div>';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: message,
                        model: model
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Show result
                resultContainer.style.display = 'block';
                resultContainer.style.backgroundColor = 
                    data.predicted_class === 1 ? '#ffebee' : '#e8f5e9';
                
                resultText.innerText = data.predicted_class === 1 ? 'SPAM DETECTED!' : 'NOT SPAM';
                resultText.style.color = data.predicted_class === 1 ? '#c62828' : '#2e7d32';
                
                confidenceText.innerText = `Confidence: ${data.confidence.toFixed(1)}%`;

                // Update probability bars
                const notSpamProbValue = (data.probabilities.ham * 100).toFixed(1);
                const spamProbValue = (data.probabilities.scam * 100).toFixed(1);
                
                notSpamProb.innerText = `${notSpamProbValue}%`;
                spamProb.innerText = `${spamProbValue}%`;
                
                notSpamBar.style.width = `${notSpamProbValue}%`;
                spamBar.style.width = `${spamProbValue}%`;

            } catch (error) {
                resultContainer.style.display = 'block';
                resultContainer.style.backgroundColor = '#fff3e0';
                resultText.innerText = 'Error';
                resultText.style.color = '#e65100';
                confidenceText.innerText = error.message;
                
                // Reset probability bars
                notSpamProb.innerText = '0%';
                spamProb.innerText = '0%';
                notSpamBar.style.width = '0%';
                spamBar.style.width = '0%';
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerText = 'Analyze Message';
            }
        }
    </script>
</body>
</html>
