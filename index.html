<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS Spam Classifier</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h2 { 
            margin-bottom: 0.5rem; 
            color: #333; 
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #45a049; 
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .result-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .confidence-text {
            font-size: 14px;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>SMS Spam Classifier</h2>
        </div>
        
        <div class="input-group">
            <label for="model">Select Model:</label>
            <select id="model">
                <option value="xlmr">XLM-R Model</option>
                <option value="bert">BERT Model</option>
                <option value="mbert">mBERT Model</option>
            </select>
        </div>

        <div class="input-group">
            <label for="message">Enter Message:</label>
            <textarea id="message" placeholder="Type or paste your message here"></textarea>
        </div>

        <button onclick="classify()" id="submitBtn">Analyze Message</button>

        <div class="result-container" id="resultContainer">
            <div class="result-text" id="resultText"></div>
            <div class="confidence-text" id="confidenceText"></div>
        </div>
    </div>

    <script>
        async function classify() {
            const message = document.getElementById('message').value.trim();
            const model = document.getElementById('model').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const confidenceText = document.getElementById('confidenceText');

            if (!message) {
                alert('Please enter a message.');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading"></div>';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: message,
                        model: model
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Show result
                resultContainer.style.display = 'block';
                resultContainer.style.backgroundColor = data.predicted_class === 1 ? '#ffebee' : '#e8f5e9';
                
                resultText.innerText = data.predicted_class === 1 ? 'SPAM DETECTED!' : 'NOT SPAM';
                resultText.style.color = data.predicted_class === 1 ? '#c62828' : '#2e7d32';
                
                confidenceText.innerText = `Confidence: ${data.confidence.toFixed(1)}%`;

            } catch (error) {
                resultContainer.style.display = 'block';
                resultContainer.style.backgroundColor = '#fff3e0';
                resultText.innerText = 'Error';
                resultText.style.color = '#e65100';
                confidenceText.innerText = error.message;
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerText = 'Analyze Message';
            }
        }
    </script>
</body>
</html>
