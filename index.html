<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Spam Classifier</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>SMS Spam Classifier</h2>
    <input type="text" id="message" placeholder="Enter your message here" />
    <br />
    <button onclick="classify()">Check</button>
    <p id="result"></p>
  </div>

  <script>
    async function classify() {
      const message = document.getElementById('message').value.trim();
      const resultElement = document.getElementById('result');

      if (message === "") {
        resultElement.innerText = "Please enter a message.";
        resultElement.style.color = "red";
        return;
      }

      try {
        const response = await fetch('https://bd58-136-158-102-114.ngrok-free.app/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        resultElement.innerText = "Result: " + data.result;
        resultElement.style.color = data.result === "spam" ? "red" : "green";
      } catch (error) {
        resultElement.innerText = "Error: Could not connect to server.";
        resultElement.style.color = "red";
      }
    }
  </script>
</body>
</html>
