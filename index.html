<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model Spam Classifier</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h2 { 
            margin-bottom: 0.5rem;
            color: #333;
        }
        .model-info {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .result-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .confidence-text {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 1rem;
        }
        .probability-bars {
            margin-top: 1rem;
            text-align: left;
        }
        .prob-bar {
            margin: 8px 0;
        }
        .prob-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .prob-fill {
            height: 8px;
            border-radius: 4px;
            transition: width 0.3s ease;
            background-color: #ddd;
        }
        .not-spam-bar { background-color: #4CAF50; }
        .spam-bar { background-color: #f44336; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        .error-message {
            color: #e65100;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            padding: 8px;
            background-color: #fff3e0;
            border-radius: 4px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .model-info-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            font-style: italic;
        }
        
        .model-performance {
            display: inline-block;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }
        
        .performance-xlmr { background-color: #e3f2fd; color: #1565c0; }
        .performance-mbert { background-color: #e8f5e9; color: #2e7d32; }
        .performance-bert { background-color: #fff3e0; color: #e65100; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Multi-Model Spam Classifier</h2>
            <p class="model-info" id="modelInfo">Compare results from different models</p>
        </div>
        
        <div class="input-group">
            <label for="model">Select Model:</label>
            <select id="model">
                <option value="xlmr">XLM-R</option>
                <option value="mbert">mBERT</option>
                <option value="bert">BERT</option>
            </select>
            <p class="model-info-text" id="modelInfo"></p>
        </div>

        <div class="input-group">
            <label for="message">Enter Message:</label>
            <textarea id="message" placeholder="Type or paste your message here"></textarea>
        </div>

        <button onclick="classify()" id="submitBtn">Analyze Message</button>

        <div class="result-container" id="resultContainer">
            <div class="result-text" id="resultText"></div>
            <div class="confidence-text" id="confidenceText"></div>
            <div class="probability-bars">
                <div class="prob-bar">
                    <div class="prob-label">
                        <span>Not Spam</span>
                        <span id="notSpamProb">0%</span>
                    </div>
                    <div class="prob-fill not-spam-bar" id="notSpamBar" style="width: 0%"></div>
                </div>
                <div class="prob-bar">
                    <div class="prob-label">
                        <span>Spam</span>
                        <span id="spamProb">0%</span>
                    </div>
                    <div class="prob-fill spam-bar" id="spamBar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentModel = 'xlmr'; // Set default model
        let modelSelect = null;

        function getModelInfo(model) {
            const info = {
                xlmr: {
                    name: 'XLM-RoBERTa'
                mbert: {
                    name: 'mBERT'
                },
                bert: {
                    name: 'BERT'
                }
            };
            return info[model] || { name: model, description: '', performance: '' };
        }

        function updateModelInfo(model) {
            const info = getModelInfo(model);
            const modelInfo = document.getElementById('modelInfo');
            modelInfo.innerHTML = `${info.description} <span class="model-performance performance-${model}">${info.performance}</span>`;
        }

        async function loadModels() {
            try {
                const response = await fetch('https://scamba.serveo.net/available_models');
                if (!response.ok) {
                    throw new Error('Failed to fetch models');
                }
                
                const data = await response.json();
                modelSelect = document.getElementById('model');
                modelSelect.innerHTML = '';
                
                if (!data.models || data.models.length === 0) {
                    throw new Error('No models available');
                }
                
                data.models.forEach(model => {
                    const info = getModelInfo(model);
                    const option = document.createElement('option');
                    option.value = model;
                    option.text = info.name;
                    modelSelect.appendChild(option);
                });
                
                // Set initial model and info
                currentModel = modelSelect.value;
                updateModelInfo(currentModel);
                
                // Update model info on change
                modelSelect.addEventListener('change', function() {
                    currentModel = this.value;
                    console.log('Switched to model:', currentModel);
                    updateModelInfo(currentModel);
                    clearResults();
                    const errorMessages = document.querySelectorAll('.error-message');
                    errorMessages.forEach(msg => msg.remove());
                });
                
            } catch (error) {
                console.error('Error loading models:', error);
                showError('Failed to load models. Please refresh the page.');
            }
        }

        function clearResults() {
            const resultContainer = document.getElementById('resultContainer');
            const notSpamProb = document.getElementById('notSpamProb');
            const spamProb = document.getElementById('spamProb');
            const notSpamBar = document.getElementById('notSpamBar');
            const spamBar = document.getElementById('spamBar');

            resultContainer.style.display = 'none';
            notSpamProb.innerText = '0%';
            spamProb.innerText = '0%';
            notSpamBar.style.width = '0%';
            spamBar.style.width = '0%';
        }

        function showError(message) {
            const container = document.querySelector('.container');
            const existingError = container.querySelector('.error-message');
            if (existingError) {
                existingError.remove();
            }
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            container.insertBefore(errorDiv, container.firstChild);
        }

        async function classify() {
            const message = document.getElementById('message').value.trim();
            if (!message) {
                alert('Please enter a message.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const confidenceText = document.getElementById('confidenceText');
            const notSpamProb = document.getElementById('notSpamProb');
            const spamProb = document.getElementById('spamProb');
            const notSpamBar = document.getElementById('notSpamBar');
            const spamBar = document.getElementById('spamBar');

            // Clear previous results
            clearResults();

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading"></div>Analyzing...';

            try {
                console.log(`Classifying with ${currentModel}:`, message);
                
                const response = await fetch('https://scamba.serveo.net/classify', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ 
                        text: message,
                        model: currentModel
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server response:', errorText);
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                console.log('Server response:', data);

                if (data.error) {
                    throw new Error(data.error);
                }

                // Display results
                resultContainer.style.display = 'block';
                
                // Handle classification result
                if (data.success === false) {
                    throw new Error(data.error || 'Classification failed');
                }

                // Update UI with results
                resultContainer.style.backgroundColor = data.predicted_class === 1 ? '#ffebee' : '#e8f5e9';
                resultText.innerText = data.predicted_class === 1 ? 'SPAM DETECTED!' : 'NOT SPAM';
                resultText.style.color = data.predicted_class === 1 ? '#c62828' : '#2e7d32';
                confidenceText.innerText = `Confidence: ${data.confidence.toFixed(1)}%`;

                // Safely get probability values
                const notSpamProbValue = (data.probabilities.ham * 100 || 0).toFixed(1);
                const spamProbValue = (data.probabilities.scam * 100 || 0).toFixed(1);
                
                // Update probability displays
                notSpamProb.innerText = `${notSpamProbValue}%`;
                spamProb.innerText = `${spamProbValue}%`;
                notSpamBar.style.width = `${notSpamProbValue}%`;
                spamBar.style.width = `${spamProbValue}%`;

            } catch (error) {
                console.error('Classification error:', error);
                resultContainer.style.display = 'block';
                resultContainer.style.backgroundColor = '#fff3e0';
                resultText.innerText = 'Error';
                resultText.style.color = '#e65100';
                confidenceText.innerText = error.message;
                showError(`Error classifying text: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Analyze Message';
            }
        }

        // Add error handling for model switching
        document.getElementById('model').addEventListener('change', function(e) {
            currentModel = e.target.value;
            console.log('Switched to model:', currentModel);
            clearResults();
            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => msg.remove());
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', loadModels);
    </script>
</body>
</html>
